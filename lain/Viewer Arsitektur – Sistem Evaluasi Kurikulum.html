<!-- ===================== 1. USE CASE ===================== -->
<script type="text/plain" data-id="uc" data-group="Use Case" data-title="Use Case Diagram">
@startuml
left to right direction
skinparam linetype polyline
skinparam nodesep 18
skinparam ranksep 90

actor "Admin" as Admin
actor "Responden" as Resp
actor "Mahasiswa" as Mhs
actor "Alumni" as Alm
actor "Perusahaan" as Prs
actor "Dosen" as Dsn

usecase "Login &\nAutentikasi (RBAC)" as UC_LOGIN
usecase "Kelola Master\nPengguna" as UC_USER
usecase "Impor Data\nPengguna (CSV/Excel)" as UC_IMPOR
usecase "Lihat Log\nImpor" as UC_LOG
usecase "Kelola Periode\nEvaluasi" as UC_PERIODE
usecase "Kelola Bank\nKuesioner" as UC_BANK
usecase "Kategori\nKompetensi" as UC_KK
usecase "Bahan\nKajian" as UC_BK
usecase "Mata\nKuliah" as UC_MK
usecase "Pertanyaan" as UC_PT
usecase "Non-aktifkan Data\n(Soft Delete)" as UC_SOFT
usecase "Dasbor\nAnalitik" as UC_DASH
usecase "Ekspor Laporan\n(PDF/Excel)" as UC_EKSPOR
usecase "Kelola Tiket\nBantuan" as UC_TIKET

usecase "Pilih & Filter\nMata Kuliah" as UC_PILIH
usecase "Isi Kuesioner" as UC_ISI
usecase "Auto-Save\nDraft" as UC_DRAFT
usecase "Isi Alasan\nNilai Skala 1-2" as UC_ALASAN
usecase "Submit Final" as UC_SUBMIT
usecase "Kirim Tiket\nBantuan" as UC_KIRIM

Admin --> UC_USER
Admin --> UC_PERIODE
Admin --> UC_BANK
Admin --> UC_DASH
Admin --> UC_TIKET
Admin --> UC_LOGIN

UC_USER <.. UC_IMPOR : <<extend>>
UC_IMPOR <.. UC_LOG : <<extend>>
UC_BANK ..> UC_KK : <<include>>
UC_BANK ..> UC_BK : <<include>>
UC_BANK ..> UC_MK : <<include>>
UC_BANK ..> UC_PT : <<include>>
UC_BANK <.. UC_SOFT : <<extend>>
UC_DASH <.. UC_EKSPOR : <<extend>>

UC_LOGIN <-- Resp
UC_PILIH <-- Resp
UC_ISI <-- Resp
UC_SUBMIT <-- Resp
UC_KIRIM <-- Resp

UC_ISI ..> UC_DRAFT : <<include>>
UC_ISI <.. UC_ALASAN : <<extend>>

Resp <|-- Mhs
Resp <|-- Alm
Resp <|-- Prs
Resp <|-- Dsn
@enduml
</script>

<!-- ===================== 2. ACTIVITY LOGIN ===================== -->
<script type="text/plain" data-id="act-login" data-group="Activity Diagram" data-title="Autentikasi (Login &amp; RBAC)">
@startuml
title Autentikasi (Login)
|Pengguna|
start
:Mengakses halaman\nLogin;
repeat
  :Memasukkan Email\ndan Password;
  :Menekan tombol\nMasuk;
  |Sistem|
  :Memverifikasi kredensial\nke Database (Bcrypt);
  backward:Menampilkan pesan\nEmail/Password salah;
repeat while (Apakah Data Valid?) is (Tidak) not (Ya)
:Membuat Session\n& Token CSRF;
:Mengecek Peran\n(Otorisasi Akses);
switch (Pengecekan Peran)
case (Admin)
  :Menampilkan Dasbor Admin,\nMaster Data, Bank Kuesioner,\nLaporan & Tiket;
case (Mahasiswa / Alumni /\nPerusahaan / Dosen)
  :Menampilkan Portal\nKuesioner Responden;
endswitch
stop
@enduml
</script>

<!-- ===================== 3. ACTIVITY PENGGUNA & IMPOR ===================== -->
<script type="text/plain" data-id="act-impor" data-group="Activity Diagram" data-title="Manajemen Pengguna &amp; Impor">
@startuml
title Manajemen Data Pengguna & Impor
|Admin|
start
:Membuka menu\nMaster Pengguna;
if (Metode Penambahan?) then (Manual)
  :Mengisi form biodata\n& memilih peran;
  :Menekan tombol\nSimpan;
  |Sistem|
  :Validasi Token CSRF\n& email unik;
  :Enkripsi password\n(Bcrypt);
  :Menyimpan ke tabel pengguna\n& profil_pengguna;
else (Impor Massal)
  |Admin|
  :Mengunduh template\nCSV/Excel;
  :Mengunggah berkas;
  |Sistem|
  :Memindai baris data\n(abaikan header);
  if (Format sesuai &\nemail unik?) then (Ya)
    :Generate password bawaan\n& enkripsi Bcrypt;
    :Menyimpan ke tabel pengguna\n& profil_pengguna;
  else (Tidak)
    :Rollback transaksi &\ntandai baris gagal;
  endif
  :Mencatat riwayat\nke log_impor;
endif
:Menampilkan notifikasi\nhasil proses;
|Admin|
:Melihat daftar\npengguna terbaru;
stop
@enduml
</script>

<!-- ===================== 4. ACTIVITY SOFT DELETE ===================== -->
<script type="text/plain" data-id="act-instrumen" data-group="Activity Diagram" data-title="Manajemen Instrumen (Soft Delete)">
@startuml
title Manajemen Bank Kuesioner
|Admin|
start
:Membuka menu\nBank Kuesioner;
:Memilih master data\n(Kategori / Bahan Kajian /\nMata Kuliah / Pertanyaan);
if (Aksi?) then (Tambah / Ubah)
  :Mengisi form data\n(Mata Kuliah: centang\nBahan Kajian terkait);
  :Menekan tombol\nSimpan;
  |Sistem|
  :Validasi Token CSRF\n& input;
  :INSERT / UPDATE data\n(+ relasi mata_kuliah_bk);
else (Non-aktifkan)
  |Admin|
  :Menekan toggle\nAktif / Non-aktif;
  |Sistem|
  :UPDATE kolom aktif = 0\n(Soft Delete, tanpa DELETE);
  :Menyembunyikan data dari\nportal responden\n(riwayat tetap utuh);
endif
:Menampilkan notifikasi\nberhasil;
|Admin|
:Melihat daftar\ndata terbaru;
stop
@enduml
</script>

<!-- ===================== 5. ACTIVITY KUESIONER ===================== -->
<script type="text/plain" data-id="act-kuesioner" data-group="Activity Diagram" data-title="Pengisian Kuesioner (Auto-Save)">
@startuml
title Pengisian Kuesioner Bersyarat
|Responden|
start
:Membuka Portal\nKuesioner;
|Sistem|
:Mengecek periode 'buka'\n& status pengisian;
if (Status pengisian?) then (Final)
  :Menampilkan pesan\nkuesioner sudah dikirim;
  stop
else (Belum / Draft)
  :Memuat draft terakhir\n(tab_terakhir & jawaban);
endif
|Responden|
:Memfilter mata kuliah\n(Semester / Bahan Kajian);
:Mencentang mata kuliah\nyang akan dinilai;
repeat
  :Mengisi jawaban\npertanyaan;
  if (Nilai skala 1 atau 2?) then (Ya)
    :Mengisi alasan\n(min. 10 karakter);
  else (Tidak)
  endif
  |Sistem|
  :Auto-Save ke\nsimpan-draf.php\n(status = draft);
repeat while (Semua bagian selesai?) is (Belum) not (Sudah)
|Responden|
:Menekan tombol\nSubmit Final;
|Sistem|
:Validasi CSRF & alasan\nskala rendah (submit-final.php);
if (Data valid?) then (Ya)
  :Mengubah status\npengisian = final;
  :Menampilkan halaman\nterima kasih;
else (Tidak)
  :Menolak pengiriman &\nmenampilkan pesan galat;
endif
stop
@enduml
</script>

<!-- ===================== 6. ACTIVITY DASBOR ===================== -->
<script type="text/plain" data-id="act-dasbor" data-group="Activity Diagram" data-title="Dasbor Analitik &amp; Ekspor">
@startuml
title Dasbor Analitik & Ekspor Laporan
|Admin|
start
:Membuka Dasbor\nAdmin;
repeat
  |Sistem|
  :Request AJAX ke\ndata-dashboard.php;
  :Agregasi data jawaban\nsesuai periode;
  fork
    :Render Radar Chart\nKompetensi;
  fork again
    :Render Peringkat\nTop / Bottom 5;
  fork again
    :Render Doughnut\nSebaran Instansi;
  fork again
    :Render Tabel Ulasan\n(paginasi);
  end fork
  :Tampilkan empty state jika 0 data\n& label "Data Terbatas" jika < 3 penilai;
  |Admin|
  :Melihat hasil\nvisualisasi;
repeat while (Ubah filter periode?) is (Ya) not (Tidak)
if (Ekspor laporan?) then (Ya)
  :Memilih format\nPDF / Excel;
  |Sistem|
  :Menyusun & mengunduh\nberkas laporan;
else (Tidak)
endif
stop
@enduml
</script>

<!-- ===================== 7. ACTIVITY TIKET ===================== -->
<script type="text/plain" data-id="act-tiket" data-group="Activity Diagram" data-title="Tiket Bantuan (Helpdesk)">
@startuml
title Tiket Bantuan (Helpdesk)
|Responden|
start
:Membuka menu\nBantuan;
:Mengisi subjek &\nisi kendala;
:Menekan tombol\nKirim Tiket;
|Sistem|
:Validasi Token CSRF;
:Menyimpan data\nke tabel tiket;
|Admin|
:Membuka menu\nKelola Tiket;
:Membaca &\nmenanggapi tiket;
|Sistem|
:Memperbarui status\n& tanggapan tiket;
|Responden|
:Melihat tanggapan\n& status tiket;
stop
@enduml
</script>

<!-- ===================== 8. ERD ===================== -->
<script type="text/plain" data-id="erd" data-group="Basis Data" data-title="Entity Relationship Diagram (ERD)">
@startuml
hide circle
hide empty methods
skinparam linetype ortho
skinparam defaultTextAlignment left

entity "pengguna" as pengguna {
  * id : INT <<PK>>
  --
  nama : VARCHAR
  email : VARCHAR
  password : VARCHAR
  peran : ENUM
}
entity "profil_pengguna" as profil {
  * pengguna_id : INT <<PK, FK>>
  --
  nomor_induk : VARCHAR
  alamat : TEXT
  telepon : VARCHAR
  posisi_pekerjaan : VARCHAR
  instansi : VARCHAR
  tahun_lulus : YEAR
}
entity "periode_evaluasi" as periode {
  * id : INT <<PK>>
  --
  tahun_akademik : VARCHAR
  semester : ENUM
  tanggal_mulai : DATE
  tanggal_selesai : DATE
  status : ENUM
}
entity "kategori_kompetensi" as kategori {
  * id : INT <<PK>>
  --
  kode : VARCHAR
  nama : VARCHAR
  aktif : BOOLEAN
}
entity "bahan_kajian" as bk {
  * id : INT <<PK>>
  --
  kategori_kompetensi_id : INT <<FK>>
  kode : VARCHAR
  nama : VARCHAR
  aktif : BOOLEAN
}
entity "mata_kuliah" as mk {
  * id : INT <<PK>>
  --
  kode : VARCHAR
  nama : VARCHAR
  semester : INT
  sks : INT
  kurikulum : VARCHAR
  kelompok : ENUM
  jenis : ENUM
  aktif : BOOLEAN
}
entity "mata_kuliah_bk" as mkbk {
  * mata_kuliah_id : INT <<PK, FK>>
  * bahan_kajian_id : INT <<PK, FK>>
}
entity "pertanyaan" as pertanyaan {
  * id : INT <<PK>>
  --
  teks : TEXT
  tipe : ENUM
  bagian : ENUM
  peran_sasaran : ENUM
  label_skala : JSON
  alasan_jika_rendah : BOOLEAN
  untuk_peringkat : BOOLEAN
  wajib : BOOLEAN
  aktif : BOOLEAN
}
entity "opsi_pertanyaan" as opsi {
  * id : INT <<PK>>
  --
  pertanyaan_id : INT <<FK>>
  teks_opsi : VARCHAR
}
entity "pengisian" as pengisian {
  * id : INT <<PK>>
  --
  pengguna_id : INT <<FK>>
  periode_id : INT <<FK>>
  tab_terakhir : VARCHAR
  status : ENUM
}
entity "pengisian_matkul" as pmk {
  * id : INT <<PK>>
  --
  pengisian_id : INT <<FK>>
  mata_kuliah_id : INT <<FK>>
}
entity "jawaban" as jawaban {
  * id : INT <<PK>>
  --
  pengisian_id : INT <<FK>>
  pertanyaan_id : INT <<FK>>
  mata_kuliah_id : INT <<FK>>
  nilai : INT
  alasan : TEXT
}
entity "jawaban_multi" as jm {
  * id : INT <<PK>>
  --
  jawaban_id : INT <<FK>>
  opsi_id : INT <<FK>>
}
entity "tiket" as tiket {
  * id : INT <<PK>>
  --
  pengguna_id : INT <<FK>>
  subjek : VARCHAR
  pesan : TEXT
  status : ENUM
}
entity "log_impor" as log {
  * id : INT <<PK>>
  --
  pengguna_id : INT <<FK>>
  nama_berkas : VARCHAR
  jumlah_berhasil : INT
  jumlah_gagal : INT
}

pengguna ||--|| profil
pengguna ||--o{ pengisian
pengguna ||--o{ tiket
pengguna ||--o{ log
periode ||--o{ pengisian
pengisian ||--o{ pmk
mk ||--o{ pmk
pengisian ||--o{ jawaban
pertanyaan ||--o{ jawaban
mk |o--o{ jawaban
pertanyaan ||--o{ opsi
jawaban ||--o{ jm
opsi ||--o{ jm
mk ||--o{ mkbk
bk ||--o{ mkbk
kategori ||--o{ bk
@enduml
</script>

<script>
/* ---------- PlantUML encoder (deflate-raw + base64 khusus PlantUML) ---------- */
function e6(b){if(b<10)return String.fromCharCode(48+b);b-=10;if(b<26)return String.fromCharCode(65+b);b-=26;if(b<26)return String.fromCharCode(97+b);b-=26;return b===0?'-':'_';}
function a3(b1,b2,b3){return e6(b1>>2&63)+e6(((b1&3)<<4|b2>>4)&63)+e6(((b2&15)<<2|b3>>6)&63)+e6(b3&63);}
function enc64(d){let r='';for(let i=0;i<d.length;i+=3){r+=a3(d[i],i+1<d.length?d[i+1]:0,i+2<d.length?d[i+2]:0);}return r;}
async function encode(text){
  const bytes=new TextEncoder().encode(text);
  if(window.CompressionStream){
    const s=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return enc64(new Uint8Array(await new Response(s).arrayBuffer()));
  }
  return '~h'+Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
}
const SERVER='https://www.plantuml.com/plantuml';
const SKIN=document.getElementById('skin').textContent.trim();
function withSkin(src){return src.replace(/@startuml[^\n]*\n/,m=>m+SKIN+'\n');}

/* ---------- State & UI ---------- */
const diagrams=[...document.querySelectorAll('script[data-id]')].map(s=>({id:s.dataset.id,group:s.dataset.group,title:s.dataset.title,src:s.textContent.trim()}));
const nav=document.getElementById('nav'),canvas=document.getElementById('canvas'),srcEl=document.getElementById('src');
let current=null,zoom=1,lastSvg='';

let g='';
diagrams.forEach(d=>{
  if(d.group!==g){g=d.group;nav.insertAdjacentHTML('beforeend',`<div class="grp">${g}</div>`);}
  const b=document.createElement('button');b.id='nav-'+d.id;b.textContent=d.title;b.onclick=()=>show(d);nav.appendChild(b);
});

async function render(src){
  canvas.innerHTML='<div class="status">Merender diagram…</div>';
  const code=await encode(withSkin(src));
  try{
    const res=await fetch(`${SERVER}/svg/${code}`);
    lastSvg=await res.text();
    canvas.innerHTML=lastSvg;
  }catch(e){
    lastSvg='';
    canvas.innerHTML=`<img src="${SERVER}/svg/${code}" alt="diagram">`;
  }
}
function show(d){
  current=d;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+d.id));
  document.getElementById('title').textContent=d.title;srcEl.value=d.src;location.hash=d.id;render(d.src);
}
function setZoom(z){zoom=Math.min(3,Math.max(.3,z));canvas.style.transform=`scale(${zoom})`;document.getElementById('btn-zoom-reset').textContent=Math.round(zoom*100)+'%';}
document.getElementById('btn-zoom-in').onclick=()=>setZoom(zoom+.1);
document.getElementById('btn-zoom-out').onclick=()=>setZoom(zoom-.1);
document.getElementById('btn-zoom-reset').onclick=()=>setZoom(1);
document.getElementById('btn-edit').onclick=()=>document.getElementById('editor').classList.toggle('open');
document.getElementById('btn-render').onclick=()=>{current.src=srcEl.value;render(current.src);};
srcEl.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();document.getElementById('btn-render').click();}});

function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
document.getElementById('btn-svg').onclick=()=>{if(lastSvg)download(new Blob([lastSvg],{type:'image/svg+xml'}),current.id+'.svg');};
document.getElementById('btn-png').onclick=()=>{
  const svg=canvas.querySelector('svg');if(!svg)return;
  const scale=3,w=svg.width.baseVal.value||svg.getBBox().width,h=svg.height.baseVal.value||svg.getBBox().height;
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>download(b,current.id+'.png'),'image/png');
  };
  img.src=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}));
};

show(diagrams.find(d=>d.id===location.hash.slice(1))||diagrams[0]);
</script>


</body></html>
